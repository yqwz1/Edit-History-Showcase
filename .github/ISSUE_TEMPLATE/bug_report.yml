name: Bug report
description: Report a reproducible problem without private project data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        This is public. Do not attach full history JSON, paid source/package files, purchase details, tokens, or proprietary files.
  - type: input
    id: tool-version
    attributes:
      label: Edit History version
      description: Package version or pre-release build identifier.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Full Unity version and operating system
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target and Inspector
      description: Scene component, prefab instance, or asset; Inspector type and sanitized field path/type.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Numbered steps to reproduce
      description: Ideally reproduce in a fresh project.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized Console text or screenshots
      description: Remove private paths, names, secrets, and project data.
